name: ShopAI CI

on:
  push:
    branches: [main, "mvp/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server/index.mjs
      - name: Run API tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler@latest deploy --dry-run
